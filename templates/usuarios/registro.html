{% extends 'base.html' %}

{% block title %}Crear cuenta | CodeAcademy Hub{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-9 col-lg-7">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h4 fw-bold mb-4">Crear cuenta</h1>
                <form method="post" novalidate>
                    {% csrf_token %}
                    {% include 'includes/campos_form.html' %}
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Registrarme</button>
                    </div>
                </form>
                <p class="small text-muted mt-3 mb-0">
                    ¿Ya tienes cuenta? <a href="{% url 'usuarios:login' %}">Ingresa</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
